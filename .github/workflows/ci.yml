name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint Intelligent Contract
        run: genvm-lint check contracts/agent_proof.py

      - name: Run deterministic state-machine tests
        run: pytest tests/test_contract_model.py -q -p no:cacheprovider

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check frontend JavaScript
        run: npm run check

      - name: Verify deployed StudioNet contract
        run: npm run verify:studio
